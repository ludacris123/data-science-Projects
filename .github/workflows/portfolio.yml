name: Portfolio checks
on:
  push:
    paths: ['portfolio_core/**', 'portfolio-ui/**', 'tests/**', 'requirements*.txt', '*/**/project.json', '.github/workflows/portfolio.yml']
  pull_request:
    paths: ['portfolio_core/**', 'portfolio-ui/**', 'tests/**', 'requirements*.txt', '*/**/project.json', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: portfolio-ui
